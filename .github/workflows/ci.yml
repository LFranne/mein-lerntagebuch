name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfe Tagebuch-Dateien
        run: |
          echo "Prüfe, ob alle Tagebuch-Eintraege vorhanden sind..."
          ls tag*.md
          echo "Alles gefunden!"